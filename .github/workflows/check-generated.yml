name: Check generated skill files

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify skill references, the .claude/skills mirror, and SKILL.md lint
        run: sh scripts/sync-skills.sh --check
